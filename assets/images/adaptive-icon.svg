    <!-- Gavel head -->
    <rect x="2" y="25" width="12" height="10" fill="#1D546C" rx="2"/>
    <!-- Bid tag -->
    <path d="M 15 20 L 28 25 L 28 40 L 15 45 Z" fill="#1A3D64"/>
